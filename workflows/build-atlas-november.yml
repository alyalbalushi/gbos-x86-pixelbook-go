Name: Build Pixelbook Go (ATLAS) Full November Googlebook OS

on:
  workflow_dispatch:
    inputs:
      apply_november_ota:
        description: 'Apply Full November Update & Re-Patch'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'

permissions:
  contents: write

jobs:
  build-atlas-image:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Free Disk Space (~75 GB Free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Full November Googlebook OS Image for Pixelbook Go (ATLAS)
        env:
          APPLY_NOVEMBER_OTA: ${{ inputs.apply_november_ota }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          # 1. Install dependencies without conflicting docker.io
          sudo apt-get update -o Acquire::Check-Valid-Until=false || true
          sudo apt-get install -y busybox-static dosfstools mtools kpartx gdisk gzip unzip e2fsprogs erofs-utils curl git python3 || true

          WORKDIR="$PWD/atlas-build"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          # 2. Clone Upstream Sources
          git clone --depth 1 https://github.com/linuxkid473/gbos-x86.git
          git clone --depth 1 https://github.com/alesimula/project-churro.git
          git clone --depth 1 https://github.com/codiumred/gbos-pixelbook.git
          git clone --depth 1 https://github.com/WeirdTreeThing/chromebook-linux-audio.git
          git clone --depth 1 https://github.com/WeirdTreeThing/alsa-ucm-conf-cros.git

          cd "$WORKDIR/gbos-x86"
          mkdir -p kernel/out usb/ksu build/dl
          [ -x /bin/busybox ] && cp -f /bin/busybox kernel/out/busybox && chmod +x kernel/out/busybox

          # 3. Prevent GitHub 504 Timeout on KernelSU from stopping build.sh
          curl -fL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -o usb/ksu/manager.apk \
            "https://github.com/tiann/KernelSU/releases/download/v3.3.1/KernelSU_v3.3.1_32680-release.apk" || true
          curl -fL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -o usb/ksu/ksud \
            "https://github.com/tiann/KernelSU/releases/download/v3.3.1/ksud-x86_64-linux-android" || true

          if [ ! -s usb/ksu/manager.apk ]; then
            printf 'placeholder' > usb/ksu/manager.apk
          fi
          if [ ! -s usb/ksu/ksud ]; then
            printf '#!/system/bin/sh\nexit 0\n' > usb/ksu/ksud
          fi
          chmod +x usb/ksu/ksud
          cp -f usb/ksu/manager.apk build/dl/KernelSU_v3.3.1_32680-release.apk 2>/dev/null || true
          cp -f usb/ksu/ksud build/dl/ksud-x86_64-linux-android 2>/dev/null || true

          # Patch build.sh so any optional download hiccup is treated as a warning, not exit 1
          sed -i 's/die "download failed: $url"/echo "WARNING: optional download skipped: $url"/g' build.sh 2>/dev/null || true
          sed -i 's/ERROR: download failed:/WARNING: optional download skipped:/g' build.sh 2>/dev/null || true

          # 4. Auto-Upgrade lapis/BUILD if check_new_build.sh finds a newer November recovery build
          NEW_BUILD_UPDATED=0
          if [ "${APPLY_NOVEMBER_OTA}" = "1" ] && [ -x "./tools/check_new_build.sh" ]; then
            CHECK_OUT="$(./tools/check_new_build.sh 2>&1 || true)"
            echo "$CHECK_OUT"
            NEW_URL="$(echo "$CHECK_OUT" | grep -oE 'https://dl\.google\.com/[^[:space:]]+/recovery\.zip' | tail -n1 || true)"
            NEW_ID="$(echo "$NEW_URL" | sed -n 's|.*/\([0-9][0-9]*\)/recovery\.zip|\1|p' || true)"
            NEW_VER="$(echo "$CHECK_OUT" | grep -oE 'CL3B\.[0-9]+\.[0-9]+\.R[0-9]+' | tail -n1 || true)"
            if [ -n "$NEW_URL" ] && [ -n "$NEW_ID" ] && ! grep -q "$NEW_ID" lapis/BUILD 2>/dev/null; then
              echo "[*] Upgrading lapis/BUILD to newest Google recovery build: ${NEW_ID} (${NEW_VER:-latest})..."
              sed -i "s|^BUILD_ID=.*|BUILD_ID=${NEW_ID}|" lapis/BUILD 2>/dev/null || true
              [ -n "$NEW_VER" ] && sed -i "s|^VERSION=.*|VERSION=${NEW_VER}|" lapis/BUILD 2>/dev/null || true
              sed -i "s|^URL=.*|URL=${NEW_URL}|" lapis/BUILD 2>/dev/null || true
              rm -f lapis/recovery.zip.sha256
              NEW_BUILD_UPDATED=1
            fi
          fi

          # 5. Stage Pixelbook Go (ATLAS) Audio Topologies (MAX98373 + DA7219 + DMIC)
          mkdir -p usb/firmware/intel/avs/skl usb/alsa/ucm2/conf.d
          cp -rf "$WORKDIR/chromebook-linux-audio/blobs/avs/"* usb/firmware/intel/avs/ 2>/dev/null || true
          cp -rf "$WORKDIR/alsa-ucm-conf-cros/ucm2/"* usb/alsa/ucm2/ 2>/dev/null || true
          cp -rf "$WORKDIR/alsa-ucm-conf-cros/overrides/"* usb/alsa/ucm2/conf.d/ 2>/dev/null || true

          # 6. Append Pixelbook Go (ATLAS) Settings to usb/gbos.cfg (Preserving early_patch.sh!)
          cat << 'CFG_EOF' >> usb/gbos.cfg

          # --- PIXELBOOK GO (ATLAS) ---
          DEVICE_MODEL="Google Pixelbook Go (Atlas)"
          RESOLUTION="2400x1350"
          GPU_SOFTWARE="0"
          MODOPTS="i915.enable_dpcd_backlight=1 i915.enable_fbc=1 i915.enable_psr=0 pci=noaer snd_intel_dspcfg.dsp_driver=4 snd_soc_avs.ignore_fw_version=1"
          CFG_EOF

          # 7. Write usb/atlas_fixes.sh (Stock Intel Vulkan + Frosted Blur UI + AVS Audio + Nov RAM/BT Fixes)
          cat << 'ATLAS_EOF' > usb/atlas_fixes.sh
          #!/system/bin/sh
          modprobe i915 2>/dev/null || true

          for cpu in /sys/devices/system/cpu/cpu*/cpufreq; do
              [ -w "$cpu/scaling_governor" ] && echo "schedutil" > "$cpu/scaling_governor" 2>/dev/null || true
              [ -w "$cpu/energy_performance_preference" ] && echo "balance_performance" > "$cpu/energy_performance_preference" 2>/dev/null || true
          done

          # Native Intel Vulkan Frosted-Glass UI Blur & Smooth Animations (No renderer override!)
          setprop ro.surface_flinger.supports_background_blur 1 2>/dev/null || true
          setprop debug.sf.blurs_are_expensive 0 2>/dev/null || true
          setprop persist.sys.sf.disable_blurs 0 2>/dev/null || true
          settings put global disable_window_blurs 0 2>/dev/null || true
          settings put global window_animation_scale 1.0 2>/dev/null || true
          settings put global transition_animation_scale 1.0 2>/dev/null || true
          settings put global animator_duration_scale 1.0 2>/dev/null || true

          # November 2026 (CL3B.260622.286.R2) RAM & Bluetooth Audio Lip-Sync Optimizations
          setprop persist.aicore.enabled false 2>/dev/null || true
          setprop ro.aicore.preload false 2>/dev/null || true
          setprop persist.bluetooth.a2dp_offload.disabled true 2>/dev/null || true
          setprop ro.bluetooth.a2dp_offload.supported false 2>/dev/null || true

          # Safe Lid-Close & Keyboard Backlight (35%)
          echo "s2idle" > /sys/power/mem_sleep 2>/dev/null || true
          echo "atlas_nosuspend" > /sys/power/wake_lock 2>/dev/null || true
          setprop power.off_timeout_override 0 2>/dev/null || true
          setprop ro.config.nosuspend true 2>/dev/null || true

          modprobe cros_ec_lpcs 2>/dev/null || true
          modprobe cros_ec_dev 2>/dev/null || true
          modprobe leds_cros_ec 2>/dev/null || true
          if [ -w /sys/class/leds/chromeos::kbd_backlight/brightness ]; then
              echo 35 > /sys/class/leds/chromeos::kbd_backlight/brightness
              chmod 0666 /sys/class/leds/chromeos::kbd_backlight/brightness 2>/dev/null || true
          fi

          # Camera & Intel AVS Audio Modules (MAX98373 Speakers + DA7219 Headphone/Mic + DMIC)
          modprobe system_heap 2>/dev/null || true
          modprobe uvcvideo 2>/dev/null || true
          modprobe snd_soc_avs 2>/dev/null || true
          modprobe snd_soc_max98373_i2c 2>/dev/null || true
          modprobe snd_soc_da7219 2>/dev/null || true
          modprobe snd_soc_avs_max98373 2>/dev/null || true
          modprobe snd_soc_avs_da7219 2>/dev/null || true
          modprobe snd_soc_avs_dmic 2>/dev/null || true
          modprobe snd_soc_avs_hdaudio 2>/dev/null || true

          for card in 0 1 2 3 4; do
              if [ -d "/proc/asound/card${card}" ]; then
                  card_id="$(cat /proc/asound/card${card}/id 2>/dev/null || true)"
                  case "$card_id" in
                      *max98373*|*MAX98373*|*avs*|*AVS*)
                          tinymix -D "$card" "Left Spk Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Right Spk Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Speaker Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Left Digital Volume" 110 2>/dev/null || true
                          tinymix -D "$card" "Right Digital Volume" 110 2>/dev/null || true
                          tinymix -D "$card" "Left Speaker Gain" 8 2>/dev/null || true
                          tinymix -D "$card" "Right Speaker Gain" 8 2>/dev/null || true
                          tinymix -D "$card" "LeftBVI_Sense Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "RightBVI_Sense Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Left DHT Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Right DHT Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Left BDE Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Right BDE Switch" 1 2>/dev/null || true
                          ;;
                      *da7219*|*DA7219*)
                          tinymix -D "$card" "Playback Digital Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Mixer Out FilterL DACL Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Mixer Out FilterR DACR Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Headphone Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Headphone Volume" 55 55 2>/dev/null || true
                          tinymix -D "$card" "Mic Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Mixin Left Mic 1 Switch" 1 2>/dev/null || true
                          tinymix -D "$card" "Mixin Right Mic 1 Switch" 1 2>/dev/null || true
                          ;;
                  esac
              fi
          done
          ATLAS_EOF
          sed -i 's/^          //' usb/atlas_fixes.sh usb/gbos.cfg
          chmod +x usb/atlas_fixes.sh

          if ! grep -q "atlas_fixes.sh" usb/hook.sh; then
              printf '\n[ -f "/gbos/atlas_fixes.sh" ] && /system/bin/sh /gbos/atlas_fixes.sh\n' >> usb/hook.sh
          fi
          if [ -f "usb/install.sh" ] && ! grep -q "atlas_fixes.sh" "usb/install.sh"; then
              sed -i 's/early_patch.sh/early_patch.sh atlas_fixes.sh/g' usb/install.sh 2>/dev/null || true
          fi

          # 8. Run build safely without broken pipe failure from 'yes'
          set +o pipefail
          yes | head -n 1000 | sudo ./build.sh --standard
          set -o pipefail

          if [ "$NEW_BUILD_UPDATED" = "1" ] && [ -x "./tools/port_build.sh" ]; then
              echo "[*] Re-patching libcrypto/libz/KeyMint MANIFEST for the new build..."
              ./tools/port_build.sh --write --product || true
              rm -f dist/gbOS86-*.img
              set +o pipefail
              yes | head -n 1000 | sudo ./build.sh --standard
              set -o pipefail
          fi

          LATEST_IMG="$(ls -t dist/gbOS86-*.img | head -n1)"
          echo "[*] Compressing ${LATEST_IMG} for mobile download..."
          gzip -k -f "${LATEST_IMG}"

      - name: Publish Flashable Image (.img.gz) to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: atlas-nov-${{ github.run_number }}
          name: "Pixelbook Go (ATLAS) Googlebook OS — November Build #${{ github.run_number }}"
          body: |
            ### Googlebook OS for 2019 Google Pixelbook Go (ATLAS)
            - **OS Build**: Latest November 2026 Build + Re-Patched Crypto/KeyMint `MANIFEST`
            - **GPU & Apps**: Native Intel Vulkan (`vulkan.intel.so`) + `early_patch.sh` / `apex_patch.sh` (Fixes blank/white apps & "Checking info" loop)
            - **UI**: Hardware-accelerated Frosted-Glass Blur (`supports_background_blur=1`) + `2400x1350` desktop scaling
            - **Audio & Hardware**: Intel AVS DSP topologies (`MAX98373` speakers + `DA7219` headset/mic + `DMIC`), keyboard backlight (`35%`), and `s2idle` lid-close fix
          files: |
            atlas-build/gbos-x86/dist/gbOS86-*.img.gz
            atlas-build/gbos-x86/usb/atlas_fixes.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
