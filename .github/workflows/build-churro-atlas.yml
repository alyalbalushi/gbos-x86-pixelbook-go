name: Build Project Churro for Pixelbook Go (ATLAS)

on:
  workflow_dispatch:
    inputs:
      apply_latest_ota:
        description: 'Apply Latest Google OTA Delta Before Building'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
      enable_hasvk_anv:
        description: 'Build Native Mesa Intel Vulkan (ANV + HasVK + Crocus/Iris) for UHD 615'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'

permissions:
  contents: write

jobs:
  build-churro-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize Free Disk Space (~85 GB Free)
        run: |
          sudo swapoff -a || true
          sudo rm -rf /mnt/swapfile /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/aws-cli /usr/local/share/chromium /usr/lib/jvm
          sudo docker system prune -a -f --volumes || true
          sudo apt-get clean
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build & Audio Firmware Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Check-Valid-Until=false || true
          sudo apt-get install -y \
            git curl wget unzip zip jq python3 python3-pip python3-venv python3-mako python3-yaml \
            gdisk parted kpartx dosfstools e2fsprogs erofs-utils mtools \
            build-essential clang lld llvm bison flex bc libssl-dev libelf-dev \
            meson ninja-build pkg-config cmake autoconf automake libtool \
            gettext autopoint gperf texinfo libsepol-dev checkpolicy zstd lz4 xz-utils \
            grub-efi-amd64-bin grub-common xorriso || true

      - name: Clone Project Churro & Pixelbook Go (ATLAS) Hardware Sources
        run: |
          set -euo pipefail
          WORKDIR="$PWD/churro-build"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          git clone --depth 1 https://github.com/alesimula/project-churro.git
          git clone --depth 1 https://github.com/WeirdTreeThing/chromebook-linux-audio.git
          git clone --depth 1 https://github.com/WeirdTreeThing/alsa-ucm-conf-cros.git

          # Download official Debian firmware-intel-sound package to extract dsp_basefw.bin & max98373/da7219 topologies
          mkdir -p "$WORKDIR/deb-fw"
          cd "$WORKDIR/deb-fw"
          FW_DEB_URL="$(curl -fsSL https://packages.debian.org/sid/all/firmware-intel-sound/download | grep -oE 'https?://[^"]+/firmware-intel-sound_[^"]+_all\.deb' | head -n1 || true)"
          if [ -n "$FW_DEB_URL" ]; then
            curl -fL -o firmware-intel-sound.deb "$FW_DEB_URL" || true
            dpkg-deb -x firmware-intel-sound.deb "$WORKDIR/deb-fw/extracted" || true
            rm -f firmware-intel-sound.deb
          fi

      - name: Patch Project Churro for Google Pixelbook Go (ATLAS — UHD 615 + AVS Audio)
        run: |
          set -euo pipefail
          WORKDIR="$PWD/churro-build"
          cd "$WORKDIR/project-churro"

          # 1. Enable Intel Gen 9.5 (UHD 615) in Mesa build (anv + hasvk + iris + crocus)
          if [ -f "gfx/build-mesa.sh" ]; then
            sed -i 's/HASVK=0/HASVK=1/g; s/BUILD_HASVK=false/BUILD_HASVK=true/g' gfx/build-mesa.sh 2>/dev/null || true
            if grep -q "vulkan-drivers" gfx/build-mesa.sh; then
              sed -i 's/-Dvulkan-drivers=nouveau/-Dvulkan-drivers=intel,intel_hasvk,nouveau,swrast/g' gfx/build-mesa.sh 2>/dev/null || true
            fi
          fi

          # 2. Add Pixelbook Go (ATLAS) Kernel Drivers (Intel AVS DSP + MAX98373 + DA7219 + CrosEC) to Churro Kernel Profile
          for kcfg in kmod/profiles/* kmod/build-kernel.sh; do
            if [ -f "$kcfg" ]; then
              cat << 'KCFG_EOF' >> "$kcfg"
          CONFIG_SND_SOC_INTEL_AVS=m
          CONFIG_SND_SOC_INTEL_AVS_MACH_DA7219=m
          CONFIG_SND_SOC_INTEL_AVS_MACH_DMIC=m
          CONFIG_SND_SOC_INTEL_AVS_MACH_HDAUDIO=m
          CONFIG_SND_SOC_INTEL_AVS_MACH_MAX98373=m
          CONFIG_SND_SOC_INTEL_AVS_MACH_MAX98927=m
          CONFIG_SND_SOC_MAX98373=m
          CONFIG_SND_SOC_MAX98373_I2C=m
          CONFIG_SND_SOC_DA7219=m
          CONFIG_MFD_CROS_EC_DEV=m
          CONFIG_CROS_EC=m
          CONFIG_CROS_EC_LPC=m
          CONFIG_CROS_EC_PROTO=y
          CONFIG_LEDS_CROS_EC=m
          CONFIG_DMABUF_HEAPS_SYSTEM=y
          KCFG_EOF
            fi
          done
          sed -i 's/^          //' kmod/profiles/* kmod/build-kernel.sh 2>/dev/null || true

          # 3. Stage Intel cAVS 1.5 Firmware & Topologies (dsp_basefw.bin, max98373-tplg.bin, da7219-tplg.bin, dmic-tplg.bin)
          FW_DEST="features/firmware-extra/vendor/firmware/intel/avs"
          mkdir -p "$FW_DEST/skl" "$FW_DEST/kbl"
          if [ -d "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/avs" ]; then
            cp -rf "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/avs/"* "$FW_DEST/" 2>/dev/null || true
          fi
          cp -rf "$WORKDIR/chromebook-linux-audio/blobs/avs/"* "$FW_DEST/" 2>/dev/null || true
          if [ -f "$FW_DEST/skl/dsp_basefw.bin" ] && [ ! -f "$FW_DEST/kbl/dsp_basefw.bin" ]; then
            cp -f "$FW_DEST/skl/dsp_basefw.bin" "$FW_DEST/kbl/dsp_basefw.bin"
          fi
          if [ -f "$FW_DEST/hda-80862809-tplg.bin" ] && [ ! -f "$FW_DEST/hda-8086280b-tplg.bin" ]; then
            cp -f "$FW_DEST/hda-80862809-tplg.bin" "$FW_DEST/hda-8086280b-tplg.bin"
          fi

          # 4. Inject Pixelbook Go (ATLAS) Display Scaling (1920x1080 @ 160 DPI), Audio Mixer, & EC Backlight into audio-generic / gfx-mesa
          mkdir -p features/audio-generic/vendor/etc/init features/audio-generic/vendor/bin
          cat << 'ATLAS_SH' > features/audio-generic/vendor/bin/churro-atlas-init.sh
          #!/vendor/bin/sh
          export PATH=/vendor/bin:/system/bin:$PATH

          # Load DMA-BUF system_heap, ChromeOS EC, Webcam, and Intel AVS Audio Stack
          for mod in system_heap uvcvideo cros_ec_lpcs cros_ec_dev leds_cros_ec \
                     snd_soc_avs snd_soc_max98373 snd_soc_max98373_i2c snd_soc_da7219 \
                     snd_soc_dmic snd_soc_hda_codec snd_soc_avs_max98373 \
                     snd_soc_avs_da7219 snd_soc_avs_dmic snd_soc_avs_hdaudio; do
              modprobe "$mod" 2>/dev/null || true
          done

          chmod 0666 /dev/dma_heap/* /dev/ashmem /dev/dri/* 2>/dev/null || true

          # Keyboard Backlight (35%) & S2Idle Sleep Fix
          if [ -w /sys/class/leds/chromeos::kbd_backlight/brightness ]; then
              echo 35 > /sys/class/leds/chromeos::kbd_backlight/brightness 2>/dev/null || true
          fi
          echo "s2idle" > /sys/power/mem_sleep 2>/dev/null || true

          # Unmute MAX98373 Speakers & DA7219 Headphone Jack
          sleep 2
          for c in 0 1 2 3 4; do
              if [ -d "/proc/asound/card${c}" ]; then
                  tinymix -D "$c" "Left Spk Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "Right Spk Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "Speaker Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "Left Digital Volume" 110 2>/dev/null || true
                  tinymix -D "$c" "Right Digital Volume" 110 2>/dev/null || true
                  tinymix -D "$c" "Left Speaker Gain" 8 2>/dev/null || true
                  tinymix -D "$c" "Right Speaker Gain" 8 2>/dev/null || true
                  tinymix -D "$c" "LeftBVI_Sense Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "RightBVI_Sense Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "Playback Digital Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "Mixer Out FilterL DACL Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "Mixer Out FilterR DACR Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "Headphone Switch" 1 2>/dev/null || true
                  tinymix -D "$c" "Headphone Volume" 55 55 2>/dev/null || true
              fi
          done
          ATLAS_SH
          sed -i 's/^          //' features/audio-generic/vendor/bin/churro-atlas-init.sh
          chmod 0755 features/audio-generic/vendor/bin/churro-atlas-init.sh

          cat << 'ATLAS_RC' > features/audio-generic/vendor/etc/init/init.churro.atlas.rc
          on early-init
              setprop ro.sf.lcd_density 160
              setprop persist.sys.dpi 160
              setprop persist.aicore.enabled false
              setprop persist.bluetooth.a2dp_offload.disabled true
              setprop ro.bluetooth.a2dp_offload.supported false

          on property:sys.boot_completed=1
              start churro_atlas_init

          service churro_atlas_init /vendor/bin/churro-atlas-init.sh
              class late_start
              user root
              group root audio graphics system
              oneshot
              seclabel u:r:vendor_init:s0
          ATLAS_RC
          sed -i 's/^          //' features/audio-generic/vendor/etc/init/init.churro.atlas.rc

      - name: Download Official Googlebook Recovery Image & Build Project Churro
        env:
          APPLY_LATEST_OTA: ${{ inputs.apply_latest_ota }}
          ENABLE_HASVK_ANV: ${{ inputs.enable_hasvk_anv }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          WORKDIR="$PWD/churro-build"
          cd "$WORKDIR/project-churro"

          # 1. Fetch official Lenovo Googlebook 15 (ruby) recovery image from Google's production catalog
          echo "[*] Querying Google production_recovery.json for official recovery image..."
          CATALOG_JSON="$(curl -fsSL https://dl.google.com/dl/edgedl/device/recovery/production_recovery.json || true)"
          REC_URL="$(echo "$CATALOG_JSON" | jq -r '.[] | select(.device=="ruby" or .model=="ruby" or (.url | contains("ruby"))) | .url' | head -n1 || true)"
          if [ -z "$REC_URL" ] || [ "$REC_URL" = "null" ]; then
            REC_URL="https://dl.google.com/device/recovery/ruby-user/16452207/recovery.zip"
          fi
          echo "[*] Downloading & streaming recovery.bin from: $REC_URL"
          curl -fL "$REC_URL" -o "$WORKDIR/recovery.zip"
          unzip -p "$WORKDIR/recovery.zip" > "$WORKDIR/recovery.bin"
          rm -f "$WORKDIR/recovery.zip"
          df -h

          # 2. Apply Google's newest OTA update delta if available (e.g. 271.R1 -> 276.R4 / 286.R2)
          CURRENT_BIN="$WORKDIR/recovery.bin"
          if [ "${APPLY_LATEST_OTA}" = "1" ] && [ -x "tools/updater/ota-check.sh" ]; then
            STEP=1
            while ./tools/updater/ota-check.sh "$CURRENT_BIN" 2>&1; do
              NEXT_BIN="$WORKDIR/recovery_ota_${STEP}.bin"
              echo "[*] Applying Google OTA update step ${STEP}..."
              ./tools/updater/ota-update.sh "$CURRENT_BIN" --bin "$NEXT_BIN" || break
              rm -f "$CURRENT_BIN"
              CURRENT_BIN="$NEXT_BIN"
              STEP=$((STEP + 1))
            done
          fi

          # 3. Ensure non-interactive execution for churro.sh (auto-accepts any prompt)
          mkdir -p out
          yes "" | HASVK=1 sudo -E ./churro.sh auto "$CURRENT_BIN" out/churro-pixelbook-go-atlas.img || \
            HASVK=1 sudo -E ./churro.sh auto "$CURRENT_BIN" out/churro-pixelbook-go-atlas.img <<< ""
          rm -f "$CURRENT_BIN"

          # 4. Split and Compress Image to strictly obey GitHub Release 2 GB asset limit
          echo "[*] Compressing and chunking into 1900MB parts (GitHub 2 GB release asset limit)..."
          cd out
          gzip -c churro-pixelbook-go-atlas.img | split -b 1900M - churro-pixelbook-go-atlas.img.gz.part-
          rm -f churro-pixelbook-go-atlas.img

          # Also create one-click reassembly scripts for Windows, Linux, and Mac
          cat << 'WIN_BAT' > REASSEMBLE.bat
          @echo off
          echo ==========================================================
          echo Reassembling churro-pixelbook-go-atlas.img.gz ...
          echo ==========================================================
          copy /b churro-pixelbook-go-atlas.img.gz.part-* churro-pixelbook-go-atlas.img.gz
          echo Done! You can now flash churro-pixelbook-go-atlas.img.gz with Rufus or balenaEtcher.
          pause
          WIN_BAT

          cat << 'SH_REASM' > reassemble.sh
          #!/bin/sh
          echo "Reassembling churro-pixelbook-go-atlas.img.gz..."
          cat churro-pixelbook-go-atlas.img.gz.part-* > churro-pixelbook-go-atlas.img.gz
          echo "Done! You can now flash churro-pixelbook-go-atlas.img.gz with balenaEtcher or dd."
          SH_REASM
          chmod +x reassemble.sh

          ls -lh churro-pixelbook-go-atlas.img.gz.part-*

      - name: Upload Flashable Project Churro Image Parts to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: churro-atlas-${{ github.run_number }}
          name: "Project Churro for Pixelbook Go (ATLAS) — Build #${{ github.run_number }}"
          body: |
            ### Project Churro (Googlebook OS / Android 17) — Google Pixelbook Go (`ATLAS`)
            - **Graphics**: Native Mesa Intel Drivers (`anv` / `hasvk` / `crocus` / `iris`) + Rebuilt `minigbm` Allocator for Intel UHD Graphics 615 (Gen 9.5)
            - **CPU & Crypto**: Recompiled BoringSSL (`libcrypto.so` + `libcrypto_httpengine.so`) for Amber Lake / Haswell+ CPUs + Kernel `vex-emulate` handler
            - **Display**: Pre-configured `1920x1080` at `160 DPI` with SDR color correction (`force_color_mode=7`)
            - **Audio & EC**: Intel cAVS 1.5 DSP (`CONFIG_SND_SOC_INTEL_AVS`) + `MAX98373` speakers + `DA7219` headphone jack + Debian `firmware-intel-sound` topologies + `s2idle` sleep & keyboard backlight

            ---
            ### How to Join the Downloaded Parts
            GitHub limits individual release files to under 2 GB, so the image is split into two parts:
            * **Windows**: Download `churro-pixelbook-go-atlas.img.gz.part-*` and `REASSEMBLE.bat` into the same folder, then double-click `REASSEMBLE.bat`.
            * **Linux / Mac / Termux**: Download the parts and run:
              ```bash
              cat churro-pixelbook-go-atlas.img.gz.part-* > churro-pixelbook-go-atlas.img.gz
              ```
            Flash the joined `churro-pixelbook-go-atlas.img.gz` using **Rufus** (DD Image mode) or **balenaEtcher**.
          files: |
            churro-build/project-churro/out/churro-pixelbook-go-atlas.img.gz.part-*
            churro-build/project-churro/out/REASSEMBLE.bat
            churro-build/project-churro/out/reassemble.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
